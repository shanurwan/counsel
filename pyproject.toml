[project]
name = "counsel"
version = "0.1.0"
description = "Agents that run a company's operations and can never make a commitment."
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "psycopg[binary]>=3.2",
  "pyyaml>=6.0",
  "croniter>=6.0",
  # Signs the triage app's requests (githubapp.py).
  "pyjwt[crypto]>=2.10,<3",
]

[project.optional-dependencies]
# tests/test_billing_guard.py also needs infra/billing_guard/requirements.txt
dev = ["pytest>=8", "mcp>=2.3,<3", "pyjwt[crypto]>=2.10,<3"]
# The MCP server: a local stdio process, or hosted with --http (docs/mcp.md).
mcp = ["mcp>=2.3,<3", "pyjwt[crypto]>=2.10,<3"]

[project.scripts]
counsel = "counsel.cli:main"
counsel-server = "counsel.server:main"
counsel-mcp = "counsel.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/counsel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
