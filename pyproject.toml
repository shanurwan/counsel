[project]
name = "counsel"
version = "0.1.0"
description = "Agents that run a company's operations and can never make a commitment."
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "psycopg[binary]>=3.2",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  # infra/billing_guard, tested in tests/test_billing_guard.py
  "functions-framework>=3.10.2",
  "google-auth>=2.30",
]

[project.scripts]
counsel = "counsel.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/counsel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
