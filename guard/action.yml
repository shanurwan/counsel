name: Counsel guard
description: Fail the build when the database role your AI agent uses can do more than guard.yaml allows.
branding:
  icon: shield
  color: red
inputs:
  config:
    description: Path to guard.yaml.
    default: guard.yaml
  database-url:
    description: An admin connection string. It is only read from, inside a read-only transaction.
    required: true
runs:
  using: composite
  steps:
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.13"
    - name: Check the agent's role against guard.yaml
      shell: bash
      env:
        DATABASE_URL: ${{ inputs.database-url }}
        CONFIG: ${{ inputs.config }}
        REF: ${{ github.action_ref }}
      run: |
        python -m pip install --quiet "counsel @ git+https://github.com/shanurwan/counsel@${REF:-main}"
        status=0
        counsel guard check --config "$CONFIG" > guard-report.txt || status=$?
        cat guard-report.txt
        { echo '## counsel guard'; echo; echo '```'; cat guard-report.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
        exit "$status"
