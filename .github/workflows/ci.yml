name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  commitments:
    name: commitments are impossible
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17@sha256:3b0cda93be7c8dba2ed484d19393d93845dc3dafb88973e248ba8e6d99d784e1
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 5s --health-retries 20
    env:
      COUNSEL_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/counsel
      COUNSEL_TEST_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]" -r infra/billing_guard/requirements.txt

      - name: Registry is valid
        run: counsel validate

      - name: Compiled grants match the registry
        run: counsel compile --check

      - name: Apply to a fresh database
        run: |
          psql "$COUNSEL_TEST_ADMIN_URL" -c "create database counsel"
          counsel migrate

      - name: Privilege audit (fails on any agent that can write a commitment)
        run: |
          counsel audit --matrix matrix.md
          { echo "## Privilege matrix (live database)"; echo; cat matrix.md; } >> "$GITHUB_STEP_SUMMARY"

      - name: Denial tests
        run: pytest -q

      - name: Incident bench
        run: counsel bench --out bench

      - name: Publish the bench summary
        if: always()
        run: |
          if [ -f bench/RESULTS.md ]; then
            cat bench/RESULTS.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: counsel-bench
          path: bench/
          if-no-files-found: error

      - name: Eval gate (golden suites, recorded Nemotron, calibrated judge)
        run: counsel eval --out evals > /dev/null

      - name: Publish the eval summary
        if: always()
        run: |
          if [ -f evals/RESULTS.md ]; then
            cat evals/RESULTS.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build the site from this run's journal
        env:
          # Public values: the consent page signs people in with the publishable key.
          SUPABASE_URL: ${{ vars.COUNSEL_SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.COUNSEL_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          mkdir _site
          cp site/index.html site/replay.html site/og.png evals/replay.json _site/
          for page in consent approve; do
            sed -e "s|__COUNSEL_SUPABASE_URL__|${SUPABASE_URL:-__COUNSEL_SUPABASE_URL__}|" \
                -e "s|__COUNSEL_SUPABASE_PUBLISHABLE_KEY__|${SUPABASE_PUBLISHABLE_KEY:-__COUNSEL_SUPABASE_PUBLISHABLE_KEY__}|" \
                "site/$page.html" > "_site/$page.html"
          done
          cp bench/results.json _site/bench.json
          cp cost/results.json _site/cost.json
          # One file, so a new migration reaches the page's Postgres by itself.
          cat db/migrations/*.sql db/generated/agents.sql db/seed/harbor_labs.sql > _site/schema.sql

      - name: The page's Postgres still loads the schema and refuses
        run: |
          npm ci --silent --no-audit --no-fund --prefix scripts/page_db
          node scripts/page_db/check.mjs _site/schema.sql

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      - name: Cost benchmark (a synthetic month, twice)
        run: |
          counsel simulate --out cost > /dev/null
          cat cost/RESULTS.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: counsel-cost
          path: cost/
          if-no-files-found: error

  pages:
    name: publish the replay
    needs: commitments
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write # Pages verifies the deployment came from this workflow
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  deploy:
    name: deploy to Cloud Run
    needs: commitments
    # Pushes to main only, and only once the infrastructure exists
    # (gh variable set DEPLOY --body on).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY == 'on'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # keyless auth to GCP through Workload Identity Federation
    concurrency:
      group: deploy
      cancel-in-progress: false
    env:
      REGION: us-central1
      IMAGE: us-central1-docker.pkg.dev/counsel-513516/counsel/counsel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: projects/1087057103019/locations/global/workloadIdentityPools/github/providers/github
          service_account: counsel-deployer@counsel-513516.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Migrate, then audit, before the new code goes live
        # Migrations only add, so the running revision keeps working on the new
        # schema; the new revision never starts against an old one. If either
        # step fails, nothing is deployed.
        run: |
          pip install -e .
          COUNSEL_DATABASE_URL="$(gcloud secrets versions access latest --secret=migrate-database-url)"
          echo "::add-mask::${COUNSEL_DATABASE_URL}"
          export COUNSEL_DATABASE_URL
          counsel migrate
          counsel audit > /dev/null
      - name: Build and push
        run: |
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          docker build -t "${IMAGE}:${GITHUB_SHA}" .
          docker push "${IMAGE}:${GITHUB_SHA}"
      - name: Deploy the image by digest
        run: |
          digest=$(gcloud artifacts docker images describe "${IMAGE}:${GITHUB_SHA}" --format='value(image_summary.digest)')
          gcloud run services update counsel --region "$REGION" --image "${IMAGE}@${digest}" --quiet
          # The support pool and the hosted MCP server run the same image, once
          # infra/pools.tf and infra/mcp.tf have created them.
          for service in counsel-support counsel-mcp; do
            if gcloud run services describe "$service" --region "$REGION" --format='value(name)' >/dev/null 2>&1; then
              gcloud run services update "$service" --region "$REGION" --image "${IMAGE}@${digest}" --quiet
            fi
          done
          gcloud run services describe counsel --region "$REGION" \
            --format='value(status.latestReadyRevisionName,status.traffic[0].percent)'
