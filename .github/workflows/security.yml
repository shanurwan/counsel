name: security

on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * 1" # weekly, to catch newly published advisories

permissions:
  contents: read

jobs:
  secrets:
    name: no secrets in history (gitleaks)
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (checksum verified)
        run: |
          curl -sSfL -o gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
      - name: Scan every commit
        run: ./gitleaks git . --redact --no-banner --exit-code 1

  python:
    name: python (bandit, pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip && pip install -e ".[dev]" bandit pip-audit
      - name: Static analysis
        run: bandit -q -r src infra/billing_guard
      - name: Known vulnerabilities in dependencies
        run: |
          pip-audit --skip-editable
          pip-audit -r infra/billing_guard/requirements.txt

  terraform:
    name: terraform (fmt, validate, checkov)
    runs-on: ubuntu-latest
    env:
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform-plugins
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      # Providers come from GitHub release downloads, which sometimes return 504s.
      # Cached by lock file, a run downloads them only when a lock file changes;
      # the lock files' checksums still verify whatever the cache holds.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .terraform-plugins
          key: terraform-plugins-${{ hashFiles('infra/.terraform.lock.hcl', 'infra/grafana/.terraform.lock.hcl') }}
      - name: Format and validate
        working-directory: infra
        run: |
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          init() {
            for attempt in 1 2 3; do
              terraform "$@" init -backend=false -input=false && return 0
              echo "terraform init failed (attempt $attempt), retrying"
              sleep $((attempt * 20))
            done
            return 1
          }
          terraform fmt -check -recursive
          init
          terraform validate
          init -chdir=grafana
          terraform -chdir=grafana validate
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Checkov (skips are documented inline with a reason)
        run: |
          pip install checkov
          checkov -d infra --framework terraform --compact --quiet

  workflows:
    name: workflows (zizmor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Audit GitHub Actions for injection, pinning and permission issues
        run: |
          pip install zizmor
          zizmor --offline .github/workflows
